# Mirrors the live Render services. They were created in the Render dashboard,
# NOT from this file (it isn't linked as a Blueprint), so the dashboard is the
# source of truth. When you change a setting there, update it here too.
services:
  # Backend Web Service — https://southeast-ins.onrender.com
  - type: web
    name: southeast-ins
    runtime: node
    region: ohio
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Not set on Render, so the code defaults apply:
      #   NOTIFICATION_EMAIL_FROM  -> Southeast Insurance <quotes@southeastins.com>
      #   NOTIFICATION_EMAIL_TO    -> info@southeastins.com
      #   RATE_LIMIT_WINDOW_MS     -> 900000 (15 min)
      #   RATE_LIMIT_MAX_REQUESTS  -> 10
      # NODE_VERSION is unpinned too. Mongoose 9 needs Node >= 20.19.

  # Frontend Static Site — https://southeastins.com
  - type: web
    name: southeast-ins-1
    runtime: static
    buildCommand: npm install; npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    # SPA fallback: lets /privacy (and any non-file path) load index.html,
    # where App.jsx picks the page from window.location.pathname.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://southeast-ins.onrender.com/api
